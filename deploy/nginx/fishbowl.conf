# 鱼盆趋势模型 — Nginx 反代（对外 80，应用只监听本机 5000）
#
# 安装：
#   sudo apt install -y nginx
#   sudo cp /root/fishbowl_trend/deploy/nginx/fishbowl.conf /etc/nginx/sites-available/fishbowl
#   sudo ln -sf /etc/nginx/sites-available/fishbowl /etc/nginx/sites-enabled/fishbowl
#   sudo rm -f /etc/nginx/sites-enabled/default   # 可选：避免与 default 冲突
#   sudo nginx -t && sudo systemctl reload nginx
#
# 访问：http://47.79.93.60/  （将 server_name 改成你的 IP 或域名）
# 安全组：放行 TCP 80；关闭对公网的 TCP 5000

server {
    listen 80;
    listen [::]:80;
    server_name 47.79.93.60;

    access_log /var/log/nginx/fishbowl_access.log;
    error_log  /var/log/nginx/fishbowl_error.log;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
